<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>SPP Classics Admin</title>
<link rel="icon" id="favicon" href="theme/vanilla/favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body class="exp-vanilla">
<div id="page">
  <aside id="side">
    <a id="logo" href="#/" title="SPP Classics - Admin Panel" aria-label="Home"></a>
    <nav id="menu" aria-label="Launcher menu"></nav>
  </aside>
  <div id="mainwrap">
    <header id="topbar"><div class="loginbox" id="statusbox">Connecting...</div></header>
    <main id="frame">
      <div class="frame-edge"></div>
      <div class="frame-mid"><div class="frame-mid-r"><div id="view"></div></div></div>
      <div class="frame-edge bottom"></div>
    </main>
    <footer id="footer">
      <span id="footer-version">SPP Classics</span> &middot; Web Launcher &middot;
      <a href="https://github.com/celguar/spp-classics-cmangos" target="_blank" rel="noopener">GitHub</a> &middot;
      World of Warcraft&reg; is a trademark of Blizzard Entertainment. This project is not affiliated with Blizzard.
    </footer>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
